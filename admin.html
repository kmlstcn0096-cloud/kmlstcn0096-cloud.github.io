<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firma Kartı Yönetim Paneli</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}
.box,.top{background:#fff;border:1px solid #e5e9ef;border-radius:22px;box-shadow:0 8px 28px #1b29400d}.top{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
h1,h2{margin:0}.top p{margin:6px 0 0;color:#7c8492}.status{padding:9px 13px;background:#e9f9f0;color:#137b42;border-radius:999px;font-size:13px;font-weight:700}
.login{max-width:440px;margin:70px auto;padding:28px}.login h1{margin-bottom:8px}.login p{color:#77808d;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:800;color:#596273;margin:0 0 6px}input,textarea{width:100%;padding:12px 13px;border:1px solid #dce2e9;border-radius:11px;font:inherit;outline:none;margin-bottom:13px}textarea{min-height:85px;resize:vertical}
button,.button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}.primary{background:#354154;color:#fff}.green{background:#18b963;color:#fff}.blue{background:#2864df;color:#fff}.light{background:#edf1f5;color:#263142}.danger{background:#fff0f0;color:#bd2525}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.msg{display:none;padding:11px 13px;border-radius:10px;margin-top:13px}.ok{display:block;background:#eaf9f0;color:#147943}.err{display:block;background:#fff0f0;color:#b42318}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.box{padding:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.full{grid-column:1/-1}
#qrcode{width:190px;height:190px;margin:18px auto;padding:8px;background:#fff;border:1px solid #e2e6ec}.qr{text-align:center}.url{font-size:12px;word-break:break-all;background:#f5f7fa;padding:9px;border-radius:9px;color:#697386}
.listbox{margin-top:18px}.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.count{background:#eef1ff;color:#4254bd;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f4;font-size:14px}th{font-size:12px;color:#747d8b;background:#fafbfc}.rowactions{display:flex;gap:7px}.small{padding:8px 10px;font-size:12px}.hidden{display:none!important}
@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}.top{align-items:flex-start}}
</style></head><body>
<div id="loginView" class="wrap"><section class="box login"><h1>Yönetici Girişi</h1><p>Firma yönetim paneline erişmek için giriş yap.</p>
<label>E-posta</label><input id="email" type="email" autocomplete="username">
<label>Şifre</label><input id="password" type="password" autocomplete="current-password">
<button class="primary" style="width:100%;justify-content:center" onclick="login()"><i class="fa-solid fa-lock"></i> Giriş Yap</button><div id="loginMsg" class="msg"></div></section></div>

<div id="adminView" class="wrap hidden">
<div class="top"><div><h1>Firma Kartı Yönetim Paneli</h1><p id="userMail"></p></div><div><span class="status"><i class="fa-solid fa-shield-halved"></i> Yönetici girişi aktif</span> <button class="light" onclick="logout()">Çıkış</button></div></div>
<div class="grid"><section class="box"><h2 id="formTitle">Yeni Firma</h2><br><input id="recordId" type="hidden">
<div class="fields">
<div><label>Firma Adı</label><input id="companyName"></div><div><label>Firma kısa adresi</label><input id="slug"></div>
<div><label>Logo URL</label><input id="logoUrl"></div><div><label>Telefon</label><input id="phone"></div>
<div><label>WhatsApp</label><input id="whatsapp"></div><div><label>Instagram</label><input id="instagram"></div>
<div class="full"><label>Google Maps</label><input id="maps"></div><div class="full"><label>Açıklama</label><textarea id="description"></textarea></div>
<div><label>Alıcı / Hesap Sahibi</label><input id="accountName"></div><div><label>IBAN</label><input id="iban"></div></div>
<div class="actions"><button class="green" onclick="saveFirm()">Kaydet</button><button class="light" onclick="newFirm()">Yeni Firma</button><button class="primary" onclick="generateQR()">QR Oluştur</button></div><div id="msg" class="msg"></div></section>
<aside class="box qr"><h2>Firma QR Kodu</h2><div id="qrcode"></div><div id="pageUrl" class="url">Firma seçildiğinde bağlantı burada görünür.</div><div class="actions" style="justify-content:center"><button class="blue" onclick="openCard()">Kartı Aç</button><button class="light" onclick="downloadQR()">QR İndir</button></div></aside></div>
<section class="box listbox"><div class="listhead"><h2>Kayıtlı Firmalar</h2><div id="count" class="count">0 firma</div></div><input id="search" placeholder="Firma ara..." oninput="renderFirms()">
<div class="tablewrap"><table><thead><tr><th>Firma</th><th>Kısa adres</th><th>Telefon</th><th>WhatsApp</th><th>İşlemler</th></tr></thead><tbody id="firmRows"></tbody></table></div></section>
</div>
<script>
const SUPABASE_URL="https://cxcuhkqidlcvifobxlpy.supabase.co",SUPABASE_ANON_KEY="sb_publishable_CjiShvDAq5eaanacxYAgDQ_tzoMAU0i";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=x=>document.getElementById(x);let firms=[];
function show(id,t,e=false){$(id).textContent=t;$(id).className="msg "+(e?"err":"ok")}
async function login(){const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return show("loginMsg","Giriş başarısız: "+error.message,true);checkSession()}
async function logout(){await db.auth.signOut();location.reload()}
async function checkSession(){const {data:{session}}=await db.auth.getSession();if(!session){$("loginView").classList.remove("hidden");$("adminView").classList.add("hidden");return}$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");$("userMail").textContent=session.user.email;loadFirms()}
function slugify(v){return(v||"").trim().toLowerCase().replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"")}
function wa(v){v=(v||"").replace(/\D/g,"");if(v.startsWith("0"))v="90"+v.slice(1);return v}function insta(v){v=(v||"").trim();if(v.startsWith("@"))v=v.slice(1);return !v||v.startsWith("http")?v:"https://instagram.com/"+v}
function fmtIban(v){return(v||"").replace(/\s/g,"").toUpperCase().replace(/(.{4})/g,"$1 ").trim()}function pageUrl(s){return location.origin+location.pathname.replace(/\/[^/]*$/,"/")+"index.html?firma="+encodeURIComponent(s)}
function vals(){return{company_name:$("companyName").value.trim(),slug:slugify($("slug").value),logo_url:$("logoUrl").value.trim(),phone:$("phone").value.trim(),whatsapp:wa($("whatsapp").value),instagram:insta($("instagram").value),maps:$("maps").value.trim(),description:$("description").value.trim(),account_name:$("accountName").value.trim(),iban:fmtIban($("iban").value)}}
async function loadFirms(){const {data,error}=await db.from("firms").select("*").order("created_at",{ascending:false});if(error)return show("msg","Liste hatası: "+error.message,true);firms=data||[];renderFirms()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderFirms(){const q=$("search").value.toLowerCase();let a=firms.filter(f=>[f.company_name,f.slug,f.phone].some(v=>(v||"").toLowerCase().includes(q)));$("count").textContent=firms.length+" firma";$("firmRows").innerHTML=a.map(f=>`<tr><td><b>${esc(f.company_name)}</b></td><td>${esc(f.slug)}</td><td>${esc(f.phone)}</td><td>${esc(f.whatsapp)}</td><td><div class="rowactions"><button class="light small" onclick="editFirm(${f.id})">Düzenle</button><a class="button blue small" target="_blank" href="${pageUrl(f.slug)}">Kart</a><button class="danger small" onclick="deleteFirm(${f.id})">Sil</button></div></td></tr>`).join("")}
function editFirm(id){let f=firms.find(x=>+x.id===+id);if(!f)return;$("recordId").value=f.id;[["companyName","company_name"],["slug","slug"],["logoUrl","logo_url"],["phone","phone"],["whatsapp","whatsapp"],["instagram","instagram"],["maps","maps"],["description","description"],["accountName","account_name"],["iban","iban"]].forEach(([a,b])=>$(a).value=f[b]||"");$("formTitle").textContent="Firma Düzenle";generateQR();scrollTo({top:0,behavior:"smooth"})}
function newFirm(){["recordId","companyName","slug","logoUrl","phone","whatsapp","instagram","maps","description","accountName","iban"].forEach(x=>$(x).value="");$("formTitle").textContent="Yeni Firma";$("qrcode").innerHTML="";$("pageUrl").textContent="Firma seçildiğinde bağlantı burada görünür."}
async function saveFirm(){let d=vals();if(!d.company_name||!d.slug)return show("msg","Firma adı ve kısa adres zorunlu.",true);let id=$("recordId").value,res=id?await db.from("firms").update(d).eq("id",id):await db.from("firms").insert(d).select().single();if(res.error)return show("msg","Kayıt hatası: "+res.error.message,true);show("msg",id?"Firma güncellendi.":"Firma kaydedildi.");if(!id&&res.data)$("recordId").value=res.data.id;await loadFirms();generateQR()}
async function deleteFirm(id){if(!confirm("Bu firma silinsin mi?"))return;const {error}=await db.from("firms").delete().eq("id",id);if(error)return show("msg","Silme hatası: "+error.message,true);show("msg","Firma silindi.");if(+$("recordId").value===+id)newFirm();loadFirms()}
function generateQR(){let s=slugify($("slug").value);if(!s)return;$("slug").value=s;let u=pageUrl(s);$("pageUrl").textContent=u;$("qrcode").innerHTML="";new QRCode($("qrcode"),{text:u,width:174,height:174})}
function openCard(){let s=slugify($("slug").value);if(s)window.open(pageUrl(s),"_blank")}function downloadQR(){let c=$("qrcode").querySelector("canvas"),i=$("qrcode").querySelector("img");if(!c&&!i)return;let a=document.createElement("a");a.download=(slugify($("slug").value)||"firma")+"-qr.png";a.href=c?c.toDataURL():i.src;a.click()}
db.auth.onAuthStateChange(()=>setTimeout(checkSession,0));checkSession();
</script></body></html>

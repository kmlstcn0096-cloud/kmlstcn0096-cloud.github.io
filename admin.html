<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firma Kartı Yönetim Paneli</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}
.top,.box{background:#fff;border:1px solid #e5e9ef;border-radius:22px;box-shadow:0 8px 28px #1b29400d}.top{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
h1,h2{margin:0}.top p{margin:6px 0 0;color:#7c8492}.status{padding:9px 13px;background:#e9f9f0;color:#137b42;border-radius:999px;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.box{padding:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:800;color:#596273;margin:0 0 6px}input,textarea{width:100%;padding:12px 13px;border:1px solid #dce2e9;border-radius:11px;font:inherit;outline:none}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus{border-color:#4b60df}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button,.button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.primary{background:#354154;color:#fff}.green{background:#18b963;color:#fff}.blue{background:#2864df;color:#fff}.light{background:#edf1f5;color:#263142}.danger{background:#fff0f0;color:#bd2525}
.msg{display:none;padding:11px 13px;border-radius:10px;margin-top:13px}.ok{display:block;background:#eaf9f0;color:#147943}.err{display:block;background:#fff0f0;color:#b42318}
#qrcode{width:190px;height:190px;margin:18px auto;padding:8px;background:#fff;border:1px solid #e2e6ec}.qr{text-align:center}.url{font-size:12px;word-break:break-all;background:#f5f7fa;padding:9px;border-radius:9px;color:#697386}
.listbox{margin-top:18px}.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.count{background:#eef1ff;color:#4254bd;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}
.search{margin-bottom:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f4;font-size:14px}th{font-size:12px;color:#747d8b;background:#fafbfc}.rowactions{display:flex;gap:7px}.small{padding:8px 10px;font-size:12px}
.empty{text-align:center;padding:30px;color:#8b93a0}
@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}.top{align-items:flex-start}.status{white-space:nowrap}}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>Firma Kartı Yönetim Paneli</h1><p>Firma ekle, düzenle ve kayıtlı firmaları yönet.</p></div><div class="status"><i class="fa-solid fa-database"></i> Supabase bağlı</div></div>

<div class="grid">
<section class="box">
<h2 id="formTitle">Firma Bilgileri</h2><br>
<input id="recordId" type="hidden">
<div class="fields">
<div><label>Firma Adı</label><input id="companyName"></div>
<div><label>Firma kısa adresi (slug)</label><input id="slug" placeholder="ornek-firma"></div>
<div><label>Logo URL</label><input id="logoUrl" placeholder="https://..."></div>
<div><label>Telefon</label><input id="phone"></div>
<div><label>WhatsApp</label><input id="whatsapp"></div>
<div><label>Instagram</label><input id="instagram"></div>
<div class="full"><label>Google Maps bağlantısı</label><input id="maps"></div>
<div class="full"><label>Açıklama</label><textarea id="description"></textarea></div>
<div><label>Alıcı / Hesap Sahibi</label><input id="accountName"></div>
<div><label>IBAN</label><input id="iban"></div>
</div>
<div class="actions"><button class="green" onclick="saveFirm()"><i class="fa-solid fa-floppy-disk"></i> Kaydet</button><button class="light" onclick="newFirm()"><i class="fa-solid fa-plus"></i> Yeni Firma</button><button class="primary" onclick="generateQR()"><i class="fa-solid fa-qrcode"></i> QR Oluştur</button></div>
<div id="msg" class="msg"></div>
</section>

<aside class="box qr">
<h2>Firma QR Kodu</h2><div id="qrcode"></div><div id="pageUrl" class="url">Firma seçildiğinde bağlantı burada görünür.</div>
<div class="actions" style="justify-content:center"><button class="blue" onclick="openCard()"><i class="fa-solid fa-arrow-up-right-from-square"></i> Kartı Aç</button><button class="light" onclick="downloadQR()"><i class="fa-solid fa-download"></i> QR İndir</button></div>
</aside>
</div>

<section class="box listbox">
<div class="listhead"><div><h2>Kayıtlı Firmalar</h2></div><div id="count" class="count">0 firma</div></div>
<div class="search"><input id="search" placeholder="Firma adı, kısa adres veya telefon ara..." oninput="renderFirms()"></div>
<div class="tablewrap"><table><thead><tr><th>Firma</th><th>Kısa adres</th><th>Telefon</th><th>WhatsApp</th><th>İşlemler</th></tr></thead><tbody id="firmRows"></tbody></table></div>
<div id="empty" class="empty hidden">Henüz kayıtlı firma yok.</div>
</section>
</div>

<script>
const SUPABASE_URL="https://cxcuhkqidlcvifobxlpy.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_CjiShvDAq5eaanacxYAgDQ_tzoMAU0i";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=x=>document.getElementById(x); let firms=[];

function slugify(v){return(v||"").trim().toLowerCase().replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"")}
function wa(v){v=(v||"").replace(/\D/g,"");if(v.startsWith("0"))v="90"+v.slice(1);return v}
function instagram(v){v=(v||"").trim();if(!v)return"";if(v.startsWith("@"))v=v.slice(1);return v.startsWith("http")?v:"https://instagram.com/"+v}
function iban(v){return(v||"").replace(/\s/g,"").toUpperCase().replace(/(.{4})/g,"$1 ").trim()}
function message(t,e=false){$("msg").textContent=t;$("msg").className="msg "+(e?"err":"ok")}
function pageUrl(slug){return location.origin+location.pathname.replace(/\/[^/]*$/,"/")+"index.html?firma="+encodeURIComponent(slug)}
function values(){return{company_name:$("companyName").value.trim(),slug:slugify($("slug").value),logo_url:$("logoUrl").value.trim(),phone:$("phone").value.trim(),whatsapp:wa($("whatsapp").value),instagram:instagram($("instagram").value),maps:$("maps").value.trim(),description:$("description").value.trim(),account_name:$("accountName").value.trim(),iban:iban($("iban").value)}}

async function loadFirms(){
 const {data,error}=await db.from("firms").select("*").order("created_at",{ascending:false});
 if(error){message("Firmalar alınamadı: "+error.message,true);return}
 firms=data||[]; renderFirms();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderFirms(){
 const q=$("search").value.toLowerCase().trim();
 const arr=firms.filter(f=>[f.company_name,f.slug,f.phone,f.whatsapp].some(v=>(v||"").toLowerCase().includes(q)));
 $("count").textContent=firms.length+" firma";
 $("firmRows").innerHTML=arr.map(f=>`<tr><td><b>${esc(f.company_name)}</b></td><td>${esc(f.slug)}</td><td>${esc(f.phone)}</td><td>${esc(f.whatsapp)}</td><td><div class="rowactions"><button class="light small" onclick="editFirm(${Number(f.id)})"><i class="fa-solid fa-pen"></i> Düzenle</button><a class="blue button small" target="_blank" href="${pageUrl(f.slug)}"><i class="fa-solid fa-eye"></i> Kart</a><button class="danger small" onclick="deleteFirm(${Number(f.id)},'${esc((f.company_name||"").replace(/'/g,""))}')"><i class="fa-solid fa-trash"></i> Sil</button></div></td></tr>`).join("");
 $("empty").classList.toggle("hidden",arr.length>0);
}
function editFirm(id){
 const f=firms.find(x=>Number(x.id)===Number(id));if(!f)return;
 $("recordId").value=f.id;$("companyName").value=f.company_name||"";$("slug").value=f.slug||"";$("logoUrl").value=f.logo_url||"";$("phone").value=f.phone||"";$("whatsapp").value=f.whatsapp||"";$("instagram").value=f.instagram||"";$("maps").value=f.maps||"";$("description").value=f.description||"";$("accountName").value=f.account_name||"";$("iban").value=f.iban||"";
 $("formTitle").textContent="Firma Düzenle";generateQR();window.scrollTo({top:0,behavior:"smooth"});
}
function newFirm(){
 ["recordId","companyName","slug","logoUrl","phone","whatsapp","instagram","maps","description","accountName","iban"].forEach(x=>$(x).value="");
 $("formTitle").textContent="Yeni Firma";$("qrcode").innerHTML="";$("pageUrl").textContent="Firma seçildiğinde bağlantı burada görünür.";$("msg").className="msg";
}
async function saveFirm(){
 const d=values();if(!d.company_name||!d.slug)return message("Firma adı ve kısa adres zorunludur.",true);
 const id=$("recordId").value;let res;
 if(id)res=await db.from("firms").update(d).eq("id",id);
 else res=await db.from("firms").insert(d).select().single();
 if(res.error)return message("Kayıt hatası: "+res.error.message,true);
 message(id?"Firma güncellendi.":"Yeni firma kaydedildi.");await loadFirms();
 if(!id&&res.data){$("recordId").value=res.data.id;$("formTitle").textContent="Firma Düzenle"} generateQR();
}
async function deleteFirm(id,name){
 if(!confirm(name+" kaydı silinsin mi?"))return;
 const {error}=await db.from("firms").delete().eq("id",id);
 if(error)return message("Silme hatası: "+error.message,true);
 if(Number($("recordId").value)===Number(id))newFirm();message("Firma silindi.");loadFirms();
}
function generateQR(){
 const slug=slugify($("slug").value);if(!slug)return message("Önce firma kısa adresini girin.",true);
 $("slug").value=slug;const u=pageUrl(slug);$("pageUrl").textContent=u;$("qrcode").innerHTML="";new QRCode($("qrcode"),{text:u,width:174,height:174});
}
function openCard(){const s=slugify($("slug").value);if(!s)return message("Önce firma seçin.",true);window.open(pageUrl(s),"_blank")}
function downloadQR(){const c=$("qrcode").querySelector("canvas"),im=$("qrcode").querySelector("img");if(!c&&!im)return message("Önce QR oluşturun.",true);const a=document.createElement("a");a.download=(slugify($("slug").value)||"firma")+"-qr.png";a.href=c?c.toDataURL("image/png"):im.src;a.click()}
loadFirms();
</script>
</body></html>

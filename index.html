<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Yiğit İletişim | Dijital Firma Kartı</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#080b10}body{padding:18px 10px}.shell{width:min(100%,430px);margin:auto;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 18px 50px #11182724;border:1px solid #e4e7ec}.hero{height:78px;background:linear-gradient(135deg,#171717,#2d281b);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 58px,#ffd22e10 58px 61px)}.content{padding:0 18px 34px;text-align:center}.logo{width:144px;height:144px;border-radius:50%;margin:-1px auto 8px;transform:translateY(-1px);border:8px solid #fff;background:#000;box-shadow:0 10px 28px #1112;overflow:hidden;position:relative;z-index:2}.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}.title{font-size:31px;font-weight:900;letter-spacing:-1.6px;margin:4px 0 4px}.subtitle{font-size:13px;letter-spacing:4px;color:#30343b;margin-bottom:25px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{height:96px;border-radius:22px;color:#fff;text-decoration:none;display:flex;align-items:center;text-align:left;padding:15px 16px;box-shadow:0 10px 22px #1111}.big i{font-size:38px;width:58px}.big b{font-size:20px;line-height:1.02}.big small{display:block;font-size:14px;font-weight:400;margin-top:8px}.call{background:linear-gradient(135deg,#58c66e,#48aa5c)}.save{background:linear-gradient(135deg,#438ff2,#2859da)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.card{height:136px;border:1px solid #edf0f3;border-radius:22px;background:#fff;box-shadow:0 8px 22px #1111;text-decoration:none;color:#090b0f;display:flex;flex-direction:column;align-items:center;justify-content:center}.ico{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:38px;margin-bottom:10px}.wa{background:#50cf70}.ig{background:linear-gradient(145deg,#a52bd4,#ee2b69 55%,#ffd23e)}.map{background:#fff;color:#4285f4;font-size:42px}.card b{font-size:14px}.card span{font-size:12px;margin-top:5px}.iban{margin-top:15px;width:100%;border:0;border-radius:22px;background:linear-gradient(135deg,#ffc83c,#f9d94f);min-height:94px;display:grid;grid-template-columns:68px 1px 1fr 28px;align-items:center;text-align:left;padding:13px 18px;cursor:pointer;color:#07090c}.iban i{font-size:36px;text-align:left}.divider{height:58px;background:#0002}.iban b{font-size:20px}.iban span{display:block;font-size:13px;margin-top:7px}.arrow{font-size:27px!important}.footer{color:#6b7280;margin-top:20px;font-size:16px}@media(max-width:390px){body{padding:8px}.content{padding-left:12px;padding-right:12px}.title{font-size:28px}.big{padding:12px}.big b{font-size:18px}.cards{gap:7px}.card{height:128px}.ico{width:60px;height:60px}}
</style>
</head>
<body>
<main class="shell">
  <div class="hero"></div>
  <section class="content">
    <div class="logo"><img src="logo_yigit.png" alt="Yiğit İletişim"></div>
    <h1 class="title">YİĞİT İLETİŞİM</h1>
    <div class="subtitle">DİJİTAL FİRMA KARTI</div>
    <div class="row2">
      <a class="big call" href="tel:+905012966196"><i class="fa-solid fa-phone"></i><div><b>ARA</b><small>0501 296 61 96</small></div></a>
      <a class="big save" href="#" id="saveContact"><i class="fa-solid fa-user-plus"></i><div><b>REHBERE<br>KAYDET</b><small>YİĞİT İLETİŞİM</small></div></a>
    </div>
    <div class="cards">
      <a class="card" href="https://wa.me/905012966196"><div class="ico wa"><i class="fa-brands fa-whatsapp"></i></div><b>WHATSAPP</b><span>MESAJ AT</span></a>
      <a class="card" href="#" id="instagram"><div class="ico ig"><i class="fa-brands fa-instagram"></i></div><b>INSTAGRAM</b><span>TAKİP ET</span></a>
      <a class="card" href="https://www.google.com/maps/search/?api=1&query=Yi%C4%9Fit+%C4%B0leti%C5%9Fim+Konya"><div class="ico map"><i class="fa-solid fa-location-dot"></i></div><b>KONUMU AÇ</b><span>GOOGLE MAPS</span></a>
    </div>
    <button class="iban" id="ibanBtn"><i class="fa-solid fa-credit-card"></i><span class="divider"></span><div><b>IBAN KOPYALA</b><span>Ödeme yapmak için tıklayın</span></div><i class="fa-solid fa-chevron-right arrow"></i></button>
    <div class="footer">YİĞİT İLETİŞİM</div>
  </section>
</main>
<script>
const SETTINGS={instagram:"",iban:""};
document.getElementById('saveContact').addEventListener('click',e=>{e.preventDefault();const v=`BEGIN:VCARD\nVERSION:3.0\nFN:Yiğit İletişim\nORG:Yiğit İletişim\nTEL;TYPE=CELL:+905012966196\nEND:VCARD`;const b=new Blob([v],{type:'text/vcard'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Yigit-Iletisim.vcf';a.click();URL.revokeObjectURL(a.href)});
document.getElementById('instagram').addEventListener('click',e=>{if(!SETTINGS.instagram){e.preventDefault()}else e.currentTarget.href=SETTINGS.instagram});
document.getElementById('ibanBtn').addEventListener('click',async()=>{if(!SETTINGS.iban)return;await navigator.clipboard.writeText(SETTINGS.iban);alert('IBAN kopyalandı.')});
</script>
</body>
</html>

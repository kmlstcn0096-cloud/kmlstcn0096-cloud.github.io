<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yiğit İletişim</title>
<!-- Poppins Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Poppins", sans-serif;
    background:
        radial-gradient(circle at top left, #333 0%, transparent 35%),
        linear-gradient(145deg, #090909, #242424);
}

.card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 28px;
    padding: 30px 22px 24px;
    text-align: center;
    box-shadow:
        0 20px 60px rgba(0,0,0,.40);
}

/* LOGO */

.logo {
    width: 82px;
    height: 82px;
    margin: 0 auto 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;
    color: #ffd400;

    border: 3px solid #ffd400;

    font-size: 24px;
    font-weight: 800;

    box-shadow: 0 8px 25px rgba(0,0,0,.18);
}

/* BAŞLIK */

h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #111;
}

/* INSTAGRAM */

.instagram {
    display: inline-block;
    margin: 7px 0 24px;
    color: #777;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
}

.instagram:hover {
    color: #111;
}

/* GENEL KUTU */

.box {
    background: #f7f7f8;
    border: 1px solid #eeeeef;
    border-radius: 18px;
    padding: 18px 15px;
    text-align: left;
    margin-bottom: 14px;
}

/* ETİKET */

.label {
    font-size: 12px;
    color: #888;
    margin-bottom: 5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .5px;
}

/* DEĞER */

.value {
    font-size: 17px;
    font-weight: 700;
    color: #171717;
    word-break: break-word;
    line-height: 1.5;
}

/* ÖDEME BAŞLIĞI */

.payment-title {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 16px;
    font-size: 17px;
    font-weight: 800;
    color: #111;
}

.payment-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: #111;
    color: #ffd400;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
}

/* IBAN KUTUSU */

.iban-area {
    background: #fff;
    border: 1px solid #e7e7e7;
    border-radius: 15px;
    padding: 14px;
}

.iban-label {
    font-size: 11px;
    color: #888;
    font-weight: 600;
    margin-bottom: 5px;
    text-transform: uppercase;
}

.iban {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .3px;
    color: #111;
    word-break: break-all;
    line-height: 1.55;
}

/* KOPYALA BUTONU */

.copy {
    width: 100%;
    border: 0;
    border-radius: 13px;

    padding: 14px;

    margin-top: 13px;

    background: #111;
    color: #fff;

    font-family: "Poppins", sans-serif;
    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background .25s ease,
        transform .15s ease,
        box-shadow .25s ease;
}

.copy:active {
    transform: scale(.98);
}

/* KOPYALANDI DURUMU */

.copy.copied {
    background: #20a65a !important;
    color: #fff !important;

    box-shadow: 0 7px 18px rgba(32,166,90,.25);
}

/* TELEFON */

.phone {
    width: 100%;

    border-radius: 14px;

    padding: 15px;

    margin-top: 14px;

    background: #ffd400;
    color: #111;

    font-size: 15px;
    font-weight: 800;

    display: block;
    text-decoration: none;

    transition: transform .15s ease, box-shadow .2s ease;
}

.phone:active {
    transform: scale(.98);
}

/* BİLGİ MESAJI */

.message {
    min-height: 18px;
    margin-top: 8px;

    color: #20a65a;

    font-size: 12px;
    font-weight: 600;
}

/* FOOTER */

footer {
    margin-top: 20px;

    color: #999;

    font-size: 11px;
    font-weight: 500;
}

</style>
</head>
</body>
<div class="card">
    <!-- LOGO -->
<div class="logo">
    Yİ
</div>

<!-- BAŞLIK -->
<h1>Yiğit İletişim</h1>

<!-- INSTAGRAM -->
<a
    class="instagram"
    href="https://instagram.com/ygtmobile"
    target="_blank"
    rel="noopener"
>
    Instagram: @ygtmobile
</a>


<!-- ALICI -->
<div class="box">

    <div class="label">
        Hesap Sahibi
    </div>

    <div class="value">
        Kemal Sütiçen
    </div>

</div>


<!-- ÖDEME -->
<div class="box">

    <div class="payment-title">

        <div class="payment-icon">
            ₺
        </div>

        <span>
            Ödeme Bilgileri
        </span>

    </div>


    <div class="iban-area">

        <div class="iban-label">
            IBAN
        </div>

        <div class="iban" id="ibanText">
            TR07 0015 7000 0000 0061 8501 99
        </div>


        <button
            class="copy"
            id="copyButton"
            type="button"
            onclick="copyIBAN()"
        >
            IBAN Kopyala
        </button>

        <div
            class="message"
            id="message"
            aria-live="polite"
        ></div>

    </div>

</div>


<!-- TELEFON -->
<a
    class="phone"
    href="tel:+905012966196"
>
    0501 296 61 96 — Ara
</a>


<!-- FOOTER -->
<footer>
    Yiğit İletişim
</footer>
    </div>
<script>

function copyIBAN() {

    const iban =
        "TR070015700000000061850199";

    const button =
        document.getElementById("copyButton");

    const message =
        document.getElementById("message");


    function copiedSuccessfully() {

        button.classList.add("copied");

        button.innerHTML =
            "✓ Kopyalandı";

        message.textContent =
            "IBAN panoya kopyalandı.";

        setTimeout(function() {

            button.classList.remove("copied");

            button.innerHTML =
                "IBAN Kopyala";

            message.textContent =
                "";

        }, 2000);
    }


    /* MODERN KOPYALAMA */

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(iban)
            .then(function() {

                copiedSuccessfully();

            })
            .catch(function() {

                fallbackCopy();

            });

    } else {

        fallbackCopy();

    }


    /* ESKİ TARAYICILAR İÇİN */

    function fallbackCopy() {

        const input =
            document.createElement("textarea");

        input.value = iban;

        input.style.position =
            "fixed";

        input.style.opacity =
            "0";

        document.body.appendChild(input);

        input.focus();

        input.select();

        try {

            const successful =
                document.execCommand("copy");

            if (successful) {

                copiedSuccessfully();

            } else {

                message.textContent =
                    "Kopyalama başarısız. IBAN'ı seçerek kopyalayabilirsiniz.";

            }

        } catch (error) {

            message.textContent =
                "Kopyalama başarısız. IBAN'ı seçerek kopyalayabilirsiniz.";

        }

        document.body.removeChild(input);

    }

}

</script>
</body>
</html>
:::

```html
<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Yiğit İletişim</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #111827;

}


.container {

    width: 100%;

    max-width: 450px;

    margin: auto;

}


/* =========================
   ANA KART
========================= */

.card {

    background: white;

    border-radius: 28px;

    padding: 30px 24px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);

}


/* =========================
   LOGO
========================= */

.logo {

    width: 95px;

    height: 95px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background: #000;

    border: 5px solid #ffd400;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #ffd400;

    font-size: 24px;

    font-weight: 900;

}


/* =========================
   BAŞLIK
========================= */

.shop-name {

    text-align: center;

    font-size: 27px;

    font-weight: 900;

    margin: 0;

}


.subtitle {

    text-align: center;

    color: #6b7280;

    margin-top: 8px;

    margin-bottom: 25px;

}


/* =========================
   BİLGİ KUTULARI
========================= */

.info {

    background: #f9fafb;

    border: 1px solid #e5e7eb;

    border-radius: 16px;

    padding: 17px;

    margin-top: 12px;

}


.info-title {

    font-size: 13px;

    color: #6b7280;

    font-weight: 700;

    margin-bottom: 6px;

}


.info-value {

    font-size: 17px;

    font-weight: 800;

    word-break: break-word;

}


/* =========================
   IBAN
========================= */

.iban-box {

    background: #111827;

    color: white;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;

}


.iban-title {

    color: #9ca3af;

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 8px;

}


.iban {

    font-size: 16px;

    font-weight: 800;

    line-height: 1.6;

    word-break: break-all;

}


.copy-btn {

    width: 100%;

    border: none;

    border-radius: 13px;

    padding: 14px;

    margin-top: 14px;

    background: #ffd400;

    color: #111;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

}


/* =========================
   BUTONLAR
========================= */

.action {

    display: block;

    width: 100%;

    text-decoration: none;

    text-align: center;

    border-radius: 14px;

    padding: 15px;

    margin-top: 12px;

    font-size: 16px;

    font-weight: 900;

}


.instagram {

    background: #111827;

    color: white;

}


.phone {

    background: #16a34a;

    color: white;

}


/* =========================
   ALT YAZI
========================= */

.footer {

    text-align: center;

    color: #9ca3af;

    font-size: 12px;

    margin-top: 20px;

}

</style>

</head>


<body>


<div class="container">


<div class="card">


    <!-- LOGO -->

    <div class="logo">

        Yİ

    </div>


    <!-- FİRMA -->

    <h1
        class="shop-name"
        id="shopName">

        YİĞİT İLETİŞİM

    </h1>


    <div class="subtitle">

        Ödeme ve İletişim Bilgileri

    </div>



    <!-- INSTAGRAM -->

    <div class="info">

        <div class="info-title">

            Instagram

        </div>

        <div
            class="info-value"
            id="instagram">

            @ygtmobile

        </div>

    </div>



    <!-- ALICI -->

    <div class="info">

        <div class="info-title">

            Alıcı / Hesap Sahibi

        </div>

        <div
            class="info-value"
            id="receiver">

            Kemal SÜTİÇEN

        </div>

    </div>



    <!-- IBAN -->

    <div class="iban-box">

        <div class="iban-title">

            IBAN

        </div>

        <div
            class="iban"
            id="iban">

            TR07 0015 7000 0000 0061 8501 99

        </div>


        <button
            class="copy-btn"
            onclick="copyIBAN()">

            📋 IBAN'ı Kopyala

        </button>

    </div>



    <!-- INSTAGRAM BUTONU -->

    <a
        class="action instagram"
        id="instagramButton"
        href="https://instagram.com/ygtmobile"
        target="_blank">

        📷 Instagram'a Git

    </a>



    <!-- TELEFON -->

    <a
        class="action phone"
        id="phoneButton"
        href="tel:05012966196">

        📞 0501 296 61 96

    </a>



    <div class="footer">

        Yiğit İletişim

    </div>


</div>

</div>



<script>

/* =========================
   IBAN KOPYALA
========================= */

function copyIBAN() {

    const iban =
        document
        .getElementById("iban")
        .innerText
        .replace(/\s/g, "");


    navigator.clipboard
        .writeText(iban)
        .then(function() {

            alert("IBAN kopyalandı.");

        })

        .catch(function() {

            alert("IBAN kopyalanamadı.");

        });

}

</script>


</body>

</html>
```

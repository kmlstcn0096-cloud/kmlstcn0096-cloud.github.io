<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YENER İLETİŞİM</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, #0b0b0b, #252525);
}
.card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 24px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 15px 45px rgba(0,0,0,.35);
}
.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 15px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  color: #ffd400;
  border: 3px solid #ffd400;
  font-size: 24px;
  font-weight: bold;
}
h1 { margin: 0; font-size: 28px; }
.instagram {
  display: inline-block;
  margin: 8px 0 25px;
  color: #666;
  text-decoration: none;
}
.box {
  background: #f5f5f5;
  border-radius: 16px;
  padding: 18px 14px;
  text-align: left;
  margin-bottom: 14px;
}
.label { font-size: 13px; color: #777; margin-bottom: 7px; }
.value { font-size: 17px; font-weight: bold; word-break: break-all; line-height: 1.5; }

button, .phone, .maps {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  display: block;
  text-decoration: none;
}
.copy { background: #111; color: white; margin-top: 12px; }
.phone { background: #ffd400; color: #111; margin-top: 12px; }
.maps { background: #e9f2ff; color: #1557a6; margin-top: 12px; }
.message {
  height: 20px;
  margin-top: 10px;
  color: #16833b;
  font-size: 13px;
  font-weight: bold;
}
footer { margin-top: 20px; color: #888; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">YNR</div>
  <h1>YENER İLETİŞİM</h1>

   </a>

   <div class="box">
    <div class="label">Alıcı</div>
    <div class="value">Kemal SÜTİÇEN</div>
  </div>

  <div class="box">
    <div class="label">IBAN</div>
    <div class="value">TR07 0015 7000 0000 0061 8501 99</div>
    <button class="copy" onclick="copyIBAN()">IBAN Kopyala</button>
    <div class="message" id="message"></div>
  </div>

  <a class="phone" href="tel:+905327215615">
    0532 721 56 15 — Ara
  </a>

  <footer>YENER İLETİŞİM</footer>
</div>

<script>
function copyIBAN() {
  const iban = "TR070015700000000061850199";
  navigator.clipboard.writeText(iban)
    .then(function() {
      document.getElementById("message").textContent = "IBAN kopyalandı.";
    })
    .catch(function() {
      const input = document.createElement("input");
      input.value = iban;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
      document.getElementById("message").textContent = "IBAN kopyalandı.";
    });
}
</script>
</body>
</html>

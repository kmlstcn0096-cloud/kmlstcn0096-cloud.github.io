<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Bilgileri</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #111827, #1f2937);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #111827;
}

.card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

.logo {
    width: 75px;
    height: 75px;
    margin: 0 auto 15px;
    border-radius: 20px;
    background: #111827;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
}

h1 {
    text-align: center;
    margin: 5px 0 8px;
    font-size: 25px;
}

.instagram {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.info {
    background: #f3f4f6;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
}

.label {
    font-size: 12px;
    color: #777;
    margin-bottom: 5px;
}

.value {
    font-size: 16px;
    font-weight: bold;
    word-break: break-word;
}

.iban-box {
    background: #111827;
    color: white;
    border-radius: 16px;
    padding: 16px;
    margin-top: 15px;
}

.iban {
    font-size: 15px;
    word-break: break-all;
    line-height: 1.5;
}

button,
.action {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px;
    margin-top: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
}

.copy {
    background: white;
    color: #111827;
}

.instagram-btn {
    background: #e1306c;
    color: white;
}

.phone-btn {
    background: #16a34a;
    color: white;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 11px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo" id="logo">Yİ</div>

    <h1 id="firma">YİĞİT İLETİŞİM</h1>

    <div class="instagram" id="instagramText">
        @ygtmobile
    </div>

    <div class="info">
        <div class="label">ALICI / HESAP SAHİBİ</div>
        <div class="value" id="alici">Kemal SÜTİÇEN</div>
    </div>

    <div class="iban-box">
        <div class="label" style="color:#aaa;">IBAN</div>
        <div class="iban" id="iban">
            TR07 0015 7000 0000 0061 8501 99
        </div>

        <button class="copy" onclick="ibanKopyala()">
            IBAN KOPYALA
        </button>
    </div>

    <a id="instagramBtn"
       class="action instagram-btn"
       target="_blank">
        INSTAGRAM'A GİT
    </a>

    <a id="phoneBtn"
       class="action phone-btn">
        TELEFONU ARA
    </a>

    <div class="footer">
        QR ile açılan güvenli bilgi sayfası
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const firma =
    params.get("firma") ||
    "YİĞİT İLETİŞİM";

const instagram =
    params.get("instagram") ||
    "ygtmobile";

const telefon =
    params.get("telefon") ||
    "0501 296 61 96";

const alici =
    params.get("alici") ||
    "Kemal SÜTİÇEN";

const iban =
    params.get("iban") ||
    "TR07 0015 7000 0000 0061 8501 99";


document.getElementById("firma").textContent = firma;

document.getElementById("alici").textContent = alici;

document.getElementById("iban").textContent = iban;

document.getElementById("instagramText").textContent =
    instagram ? "@" + instagram.replace("@", "") : "";

const instagramBtn =
    document.getElementById("instagramBtn");

if (instagram) {

    instagramBtn.href =
        "https://instagram.com/" +
        instagram.replace("@", "");

} else {

    instagramBtn.style.display = "none";

}


const phoneBtn =
    document.getElementById("phoneBtn");

if (telefon) {

    phoneBtn.href =
        "tel:" + telefon.replace(/\D/g, "");

} else {

    phoneBtn.style.display = "none";

}


function ibanKopyala() {

    navigator.clipboard.writeText(iban)
    .then(function() {

        alert("IBAN kopyalandı.");

    })
    .catch(function() {

        alert("IBAN: " + iban);

    });

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma Kartı</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#111827}
.wrap{max-width:520px;margin:0 auto;padding:25px 16px 40px}
.card{background:#fff;border-radius:24px;padding:28px 20px;box-shadow:0 12px 35px #00000012;text-align:center}
.logo{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 5px 20px #0002;background:#f3f4f6}
h1{margin:18px 0 8px;font-size:28px}
.sub{color:#6b7280;margin-bottom:22px}
.buttons{display:grid;gap:11px}
a{display:block;text-decoration:none;padding:14px;border-radius:13px;font-weight:700;background:#111827;color:white}
a.whatsapp{background:#16a34a}
a.instagram{background:#db2777}
a.maps{background:#2563eb}
a.web{background:#7c3aed}
a.phone{background:#374151}
.error{margin-top:30px;background:#fff;padding:25px;border-radius:20px;text-align:center}
small{color:#9ca3af}
</style>
</head>
<body>
<div class="wrap">
  <div id="content" class="card">Firma bilgileri yükleniyor...</div>
</div>

<script>
const SUPABASE_URL = "https://tqsoknbsxyjhtsguncqa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FHGDhQ9yldxGbLAbcImPoQ_KQHEebBx";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function url(v){
  if(!v) return "";
  return /^https?:\/\//i.test(v) ? v : "https://" + v;
}
function whatsapp(v){
  if(!v) return "";
  let n=String(v).replace(/\D/g,"");
  if(n.startsWith("0")) n="90"+n.slice(1);
  if(!n.startsWith("90")) n="90"+n;
  return "https://wa.me/"+n;
}

async function load(){
  const slug=new URLSearchParams(location.search).get("firma");
  const box=document.getElementById("content");

  if(!slug){
    box.innerHTML='<div class="error"><h2>Firma bulunamadı</h2><p>Geçerli bir firma bağlantısı bulunmuyor.</p></div>';
    return;
  }

  const {data,error}=await supabaseClient
    .from("firmalar")
    .select("firma_adi,slug,telefon,whatsapp,instagram,google_maps,web_sitesi,logo_url")
    .eq("slug",slug)
    .eq("aktif",true)
    .maybeSingle();

  if(error || !data){
    box.innerHTML='<div class="error"><h2>Firma bulunamadı</h2><p>Bu firma bağlantısı aktif değil veya mevcut değil.</p><small>'+esc(slug)+'</small></div>';
    return;
  }

  document.title=data.firma_adi || "Firma Kartı";

  let buttons="";
  if(data.telefon){
    const tel=String(data.telefon).replace(/\s+/g,"");
    buttons+=`<a class="phone" href="tel:${esc(tel)}">📞 Telefon</a>`;
  }
  if(data.whatsapp){
    buttons+=`<a class="whatsapp" href="${esc(whatsapp(data.whatsapp))}" target="_blank" rel="noopener">💬 WhatsApp</a>`;
  }
  if(data.instagram){
    buttons+=`<a class="instagram" href="${esc(url(data.instagram))}" target="_blank" rel="noopener">📸 Instagram</a>`;
  }
  if(data.google_maps){
    buttons+=`<a class="maps" href="${esc(url(data.google_maps))}" target="_blank" rel="noopener">📍 Google Maps</a>`;
  }
  if(data.web_sitesi){
    buttons+=`<a class="web" href="${esc(url(data.web_sitesi))}" target="_blank" rel="noopener">🌐 Web Sitesi</a>`;
  }

  const logo=data.logo_url
    ? `<img class="logo" src="${esc(url(data.logo_url))}" alt="${esc(data.firma_adi)}" onerror="this.style.display='none'">`
    : "";

  box.innerHTML=`
    ${logo}
    <h1>${esc(data.firma_adi)}</h1>
    <div class="sub">Dijital Firma Kartı</div>
    <div class="buttons">${buttons}</div>
  `;
}
load();
</script>
</body>
</html>
